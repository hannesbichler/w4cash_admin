<!-- One sprite for the whole shell: every icon is a 24x24 stroke path drawn in the current
     text colour, so the same symbol works on the blue bar, in a white menu and when active.
     Referenced below with <use>. -->
<svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-catalog" viewBox="0 0 24 24">
    <path d="M21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8a2 2 0 0 1 1-1.73l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8z"/>
    <path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
  </symbol>
  <symbol id="i-products" viewBox="0 0 24 24">
    <path d="M3 2v7c0 1.1.9 2 2 2h1a2 2 0 0 0 2-2V2"/><path d="M6 11v11"/>
    <path d="M18 2a4 4 0 0 0-3 3.9V13h3"/><path d="M18 2v20"/>
  </symbol>
  <symbol id="i-categories" viewBox="0 0 24 24">
    <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>
  </symbol>
  <symbol id="i-attributes" viewBox="0 0 24 24">
    <path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/>
    <path d="M21 20h-5"/><path d="M12 20H3"/>
    <path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/>
  </symbol>
  <symbol id="i-taxes" viewBox="0 0 24 24">
    <path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>
  </symbol>
  <symbol id="i-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </symbol>
  <symbol id="i-floors" viewBox="0 0 24 24">
    <rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/>
    <rect width="7" height="7" x="3" y="14" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/>
  </symbol>
  <symbol id="i-printer" viewBox="0 0 24 24">
    <path d="M6 9V2h12v7"/>
    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
    <rect width="12" height="8" x="6" y="14" rx="1"/>
  </symbol>
  <symbol id="i-operators" viewBox="0 0 24 24">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </symbol>
  <symbol id="i-cash" viewBox="0 0 24 24">
    <rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/>
    <path d="M6 12h.01"/><path d="M18 12h.01"/>
  </symbol>
  <symbol id="i-analytics" viewBox="0 0 24 24">
    <path d="M6 20v-4"/><path d="M12 20V10"/><path d="M18 20V4"/>
  </symbol>
  <symbol id="i-printjobs" viewBox="0 0 24 24">
    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h6"/>
    <path d="M16 13H8"/><path d="M16 17H8"/>
  </symbol>
  <symbol id="i-reports" viewBox="0 0 24 24">
    <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
  </symbol>
</svg>

<div class="layout">
  @if (loggedIn()) {
  <header>
    <div class="header-bar">
      <h1>{{ t('app.title') }}</h1>
      <div class="header-actions">
        <label class="lang-switch">
          {{ t('nav.language') }}
          <select [value]="lang()" (change)="setLang($any($event.target).value)">
            @for (l of langs; track l) {
              <option [value]="l" [selected]="l === lang()">{{ langLabel(l) }}</option>
            }
          </select>
        </label>

        <div class="account-menu-wrap">
          <button type="button" class="account-button" (click)="toggleAccountMenu($event)">
            <span class="account-label">{{ loggedIn() ? userName() : 'Account' }}</span>
            <span class="caret">{{ accountMenuOpen() ? '▴' : '▾' }}</span>
          </button>

          @if (accountMenuOpen()) {
            <div class="account-dropdown" (click)="$event.stopPropagation()">
              @if (loggedIn()) {
                <button type="button" class="dropdown-item" (click)="signOut()">Sign out</button>
              } @else {
                <button type="button" class="dropdown-item" (click)="signInWithMicrosoft()">
                  Sign in with Microsoft
                </button>
              }
            </div>
          }
        </div>
      </div>
    </div>
    <nav class="main-nav">
      <!-- Product configuration opens the rail down the left rather than a dropdown; its four
           screens are worked through in sequence, so they stay put while you move between them.
           Icons live here rather than in the translations, since they carry no language. -->
      <button type="button" class="nav-group-toggle" [class.active]="sideNav() === 'product-config'"
              (click)="toggleSideNav('product-config', $event)"
              [attr.aria-expanded]="sideNav() === 'product-config'">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-catalog"></use></svg>
        {{ t('nav.productConfig') }}
        <span class="caret">{{ sideNav() === 'product-config' ? '◂' : '▸' }}</span>
      </button>

      <button type="button" class="nav-group-toggle" [class.active]="sideNav() === 'configuration'"
              (click)="toggleSideNav('configuration', $event)"
              [attr.aria-expanded]="sideNav() === 'configuration'">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-settings"></use></svg>
        {{ t('nav.configuration') }}
        <span class="caret">{{ sideNav() === 'configuration' ? '◂' : '▸' }}</span>
      </button>

      <a routerLink="/close-cash" routerLinkActive="active">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-cash"></use></svg>{{ t('nav.closeCash') }}
      </a>

      <button type="button" class="nav-group-toggle" [class.active]="sideNav() === 'analytics'"
              (click)="toggleSideNav('analytics', $event)"
              [attr.aria-expanded]="sideNav() === 'analytics'">
        <svg class="nav-icon" aria-hidden="true"><use href="#i-analytics"></use></svg>
        {{ t('nav.analytics') }}
        <span class="caret">{{ sideNav() === 'analytics' ? '◂' : '▸' }}</span>
      </button>
    </nav>
  </header>
  }

  <div class="body">
    @if (loggedIn() && rail(); as rail) {
      <!-- Clicks inside the rail must not reach the document handler that closes the dropdowns,
           or picking a screen would shut the rail you picked it from. -->
      <nav class="side-nav" [attr.aria-label]="t(rail.title)" (click)="$event.stopPropagation()">
        <div class="side-nav-title">{{ t(rail.title) }}</div>
        @for (item of rail.items; track item.link) {
          <a [routerLink]="item.link" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: item.exact === true }">
            <svg class="nav-icon" aria-hidden="true"><use [attr.href]="'#' + item.icon"></use></svg>
            {{ t(item.label) }}
          </a>
        }
      </nav>
    }

    <div class="view">
      <router-outlet />
    </div>
  </div>
</div>
